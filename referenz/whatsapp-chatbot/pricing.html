<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Selim-IT – WhatsApp Chatbot: Pakete &amp; Preise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600&family=SUSE+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F0F4F3;
    --navy: #0B2E3C;
    --grad-start: #1B6E7A;
    --grad-end: #4FB8A6;
    --text-body: #46595E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Outfit',sans-serif;
    padding:56px 24px;
    color:var(--navy);
  }
  .wrap{max-width:1040px;margin:0 auto;}

  /* Billing toggle — centered */
  .toggle-row{display:flex;justify-content:center;margin-bottom:36px;}
  .toggle{
    position:relative;display:inline-flex;
    background:#fff;border:1px solid #D7E0DE;
    border-radius:999px;padding:4px;
  }
  .toggle button{
    position:relative;z-index:2;border:none;background:transparent;
    font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;
    padding:9px 22px;border-radius:999px;cursor:pointer;
    color:var(--text-body);transition:color .25s ease;
  }
  .toggle button.active{color:#fff;}
  .toggle-thumb{
    position:absolute;top:4px;bottom:4px;left:4px;
    width:calc(50% - 4px);border-radius:999px;
    background:linear-gradient(135deg,var(--grad-end),var(--grad-start));
    transition:transform .25s ease;z-index:1;
  }
  .toggle-thumb.right{transform:translateX(100%);}

  /* Setup / Einrichtungspaket */
  .setup-card{
    background:#fff;
    border:1.5px dashed var(--grad-end);
    border-radius:18px;
    padding:28px 30px;
    margin-bottom:24px;
    position:relative;
  }
  .setup-badge{
    display:inline-flex;align-items:center;
    font-size:11px;font-weight:600;letter-spacing:.04em;
    color:#fff;background:var(--navy);
    padding:5px 13px;border-radius:999px;
    margin-bottom:14px;
  }
  .setup-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px;}
  .setup-name{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;margin:0 0 6px;}
  .setup-tagline{font-size:13.5px;color:var(--text-body);margin:0;max-width:440px;}
  .setup-price-block{text-align:right;flex-shrink:0;}
  .setup-price-row{display:flex;align-items:baseline;gap:6px;justify-content:flex-end;}
  .setup-price-prefix{font-size:13px;color:var(--text-body);}
  .setup-price{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;}
  .setup-price-unit{font-size:12.5px;color:var(--text-body);margin:2px 0 0;}
  .setup-features{
    list-style:none;margin:0 0 22px;padding:0;
    display:grid;grid-template-columns:repeat(2,1fr);
    row-gap:10px;column-gap:20px;
  }
  .setup-features li{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.4;color:var(--navy);}
  .setup-features svg{flex-shrink:0;margin-top:2px;}
  .setup-cta{
    border:none;border-radius:999px;padding:12px 26px;
    font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;
    cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--grad-end),var(--grad-start));
  }
  @media(max-width:700px){.setup-features{grid-template-columns:1fr;}.setup-price-block{text-align:left;}.setup-price-row{justify-content:flex-start;}}

  /* Cards */
  .cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    align-items:stretch;
  }
  .card{
    background:#fff;
    border:1px solid #D7E0DE;
    border-radius:18px;
    padding:26px 24px 24px;
    display:flex;flex-direction:column;
    position:relative;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .card:hover{box-shadow:0 10px 28px rgba(11,46,60,.09);transform:translateY(-2px);}
  .card.accent{border:2px solid var(--grad-end);}

  .badge{
    position:absolute;top:-13px;right:24px;
    font-size:11px;font-weight:600;letter-spacing:.04em;
    padding:5px 14px;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,var(--grad-end),var(--grad-start));
  }

  .pkg-name{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:600;margin:0 0 6px;}
  .pkg-tagline{font-size:13.5px;color:var(--text-body);margin:0 0 20px;min-height:20px;}

  .price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;flex-wrap:wrap;}
  .price-prefix{font-size:13px;color:var(--text-body);}
  .price{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;}
  .save-pill{
    font-size:12px;font-weight:600;
    color:var(--grad-start);
    border:1px solid var(--grad-end);
    padding:3px 10px;border-radius:999px;
  }
  .price-period{font-size:12.5px;color:var(--text-body);margin:0 0 20px;}

  .cta{
    border:none;border-radius:999px;padding:13px 0;
    font-family:'Outfit',sans-serif;font-size:14.5px;font-weight:600;
    cursor:pointer;color:#fff;background:var(--navy);
    margin-bottom:22px;
  }
  .card.accent .cta{background:linear-gradient(135deg,var(--grad-end),var(--grad-start));}

  .divider{height:1px;background:#E4EAE9;margin:0 0 20px;}

  .section-label{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;font-weight:700;color:var(--navy);
    margin:0 0 12px;
  }

  .item-list{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:10px;}
  .item-list li{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.4;color:var(--navy);}
  .item-list li.excluded{color:#A3ADAB;}
  .item-list svg{flex-shrink:0;margin-top:2px;}
  .item-note{font-family:'SUSE Mono',monospace;font-size:11.5px;color:var(--text-body);margin-left:4px;}
  .item-list li.excluded .item-note{color:#A3ADAB;}

  .inherit-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--navy);}
  .inherit-row .pill{
    background:#F0F4F3;border:1px solid #E4EAE9;
    font-weight:600;font-size:12.5px;
    padding:2px 10px;border-radius:999px;
  }

  .features-list{margin-top:auto;}

  /* Tooltip */
  .info-wrap{position:relative;display:inline-flex;align-items:center;cursor:help;margin-left:2px;}
  .info-wrap svg{opacity:.55;}
  .tooltip-bubble{
    visibility:hidden;opacity:0;
    position:absolute;bottom:135%;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;
    font-size:12px;line-height:1.45;font-weight:400;
    padding:10px 13px;border-radius:10px;
    width:220px;
    transition:opacity .15s ease;
    z-index:20;
    text-align:left;
  }
  .tooltip-bubble::after{
    content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--navy);
  }
  .info-wrap:hover .tooltip-bubble, .info-wrap:focus .tooltip-bubble{visibility:visible;opacity:1;}

  .price-disclaimer{
    text-align:center;
    font-size:12px;color:#8A9A98;
    margin:18px 0 0;
  }

  @media(max-width:820px){.cards{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="setup-card">
    <span class="setup-badge">Einmalig</span>
    <div class="setup-top">
      <div>
        <p class="setup-name">Einrichtung &amp; Onboarding</p>
        <p class="setup-tagline">Für einen professionellen Start Ihres WhatsApp Chatbots — individuell auf Ihr Unternehmen zugeschnitten.</p>
      </div>
      <div class="setup-price-block">
        <div class="setup-price-row">
          <span class="setup-price-prefix">Ab</span>
          <span class="setup-price">499 €</span>
        </div>
        <p class="setup-price-unit">einmalig</p>
      </div>
    </div>
    <ul class="setup-features" id="setup-features"></ul>
  </div>

  <div class="toggle-row">
    <div class="toggle">
      <div class="toggle-thumb" id="thumb"></div>
      <button class="active" id="btn-monthly" onclick="setBilling('monthly')">Monatlich</button>
      <button id="btn-annual" onclick="setBilling('annual')">Jährlich</button>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <p class="price-disclaimer">Alle Preise verstehen sich netto, zzgl. gesetzlicher MwSt.</p>
</div>

<script>
const check = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
const xMark = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C3CCCA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
const xMarkSmall = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#C3CCCA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
const checkSmall = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
const arrowLeft = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="url(#brandGrad)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="11 18 5 12 11 6"></polyline></svg>';

function infoTip(text){
  return `<span class="info-wrap" tabindex="0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A9A98" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16"></line><circle cx="12" cy="8" r="0.5" fill="#8A9A98"></circle></svg><span class="tooltip-bubble">${text}</span></span>`;
}
const infoIconPlain = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A9A98" stroke-width="2" style="flex-shrink:0;margin-top:2px;opacity:.55;"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16"></line><circle cx="12" cy="8" r="0.5" fill="#8A9A98"></circle></svg>';

const setupFeatures = [
  'Analyse Ihrer Geschäftsprozesse',
  'Unternehmensspezifische Konfiguration',
  'Dialogflows & Antwortlogik',
  'Rechtskonforme Kommunikation (DSGVO-konform)',
  'Anbindung an WhatsApp Business API',
  'Systemanbindung & technisches Setup',
  'Proof of Concept & Revisionen',
  'Go-Live-Begleitung'
];
document.getElementById('setup-features').innerHTML = setupFeatures.map(f => `<li>${check}<span>${f}</span></li>`).join('');

const plans = [
  {
    id:'solo', cls:'light', badge:null,
    name:'Solo', tagline:'Geeignet für bis zu 100 Konversationen/Monat',
    monthly:69, annual:58, save:11, prefix:null, cta:'Jetzt starten',
    inkludiert:[
      {included:true, text:'100 Konversationen pro Monat'},
      {included:true, text:'1 WhatsApp-Nummer', note:'jede weitere €19/Monat'},
      {included:true, text:'∞ Chatbots'},
      {included:true, text:'1 User'}
    ],
    features:[
      {text:'Chat-Übergabe an Menschen', info:true},
      {text:'Automatischer Terminplaner', info:true}
    ]
  },
  {
    id:'team', cls:'accent', badge:'Beliebt',
    name:'Team', tagline:'Geeignet für bis zu 500 Konversationen/Monat',
    monthly:249, annual:208, save:41, prefix:null, cta:'Jetzt starten',
    inkludiert:[
      {included:true, text:'500 Konversationen/Monat'},
      {included:true, text:'3 WhatsApp-Nummern', note:'jede weitere €19/Monat'},
      {included:true, text:'∞ Chatbots'},
      {included:true, text:'∞ User'}
    ],
    features:[
      {inherit:'Solo'},
      {text:'Unterstützung bei der Einrichtung', info:true}
    ]
  },
  {
    id:'scale', cls:'light', badge:null,
    name:'Scale', tagline:'Geeignet ab 1.000 Konversationen/Monat',
    monthly:499, annual:424, save:75, prefix:'Ab', cta:'Plan erstellen',
    inkludiert:[
      {included:true, text:'1000 Konversationen/Monat'},
      {included:true, text:'Individuelle WhatsApp-Nummern'},
      {included:true, text:'∞ Chatbots'},
      {included:true, text:'∞ User'}
    ],
    features:[
      {inherit:'Team'},
      {text:'Keine Datenspeicherung'},
      {text:'Individueller SLA'}
    ]
  }
];

let billing = 'monthly';
function fmt(n){ return n.toLocaleString('de-DE',{maximumFractionDigits:2}); }

function renderItem(item){
  if(item.inherit){
    return `<li><span class="inherit-row">${arrowLeft}<span>Alles in</span><span class="pill">${item.inherit}</span></span></li>`;
  }
  const icon = item.included === false ? xMark : check;
  const cls = item.included === false ? 'excluded' : '';
  const note = item.note ? `<span class="item-note">${item.note}</span>` : '';
  const tip = item.tip ? infoTip(item.tip) : (item.info ? infoIconPlain : '');
  return `<li class="${cls}">${icon}<span>${item.text}${note}${tip}</span></li>`;
}

function render(){
  document.getElementById('cards').innerHTML = plans.map(p => {
    const isAnnual = billing === 'annual';
    const price = isAnnual ? p.annual : p.monthly;
    return `
    <div class="card ${p.cls}">
      ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
      <p class="pkg-name">${p.name}</p>
      <p class="pkg-tagline">${p.tagline}</p>
      <div class="price-row">
        ${p.prefix ? `<span class="price-prefix">${p.prefix}</span>` : ''}
        <span class="price">€${fmt(price)}</span>
        ${isAnnual ? `<span class="save-pill">Spare €${p.save}</span>` : ''}
      </div>
      <p class="price-period">${isAnnual ? 'Pro Monat, jährlich abgerechnet' : 'Pro Monat'}</p>
      <button class="cta">${p.cta}</button>
      <div class="divider"></div>
      <p class="section-label">Inkludiert</p>
      <ul class="item-list">
        ${p.inkludiert.map(i => renderItem(i)).join('')}
      </ul>
      <p class="section-label">Features</p>
      <ul class="item-list features-list">
        ${p.features.map(f => renderItem(f)).join('')}
      </ul>
    </div>`;
  }).join('');
}

function setBilling(mode){
  billing = mode;
  document.getElementById('btn-monthly').classList.toggle('active', mode==='monthly');
  document.getElementById('btn-annual').classList.toggle('active', mode==='annual');
  document.getElementById('thumb').classList.toggle('right', mode==='annual');
  render();
}

render();

</script>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FB8A6"/>
      <stop offset="1" stop-color="#1B6E7A"/>
    </linearGradient>
  </defs>
</svg>
</body>
</html>
