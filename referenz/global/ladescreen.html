<title>Selim-IT — Ladescreen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0B2E3C;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #loader { position: relative; width: 320px; }

  #loader svg {
    position: relative;
    width: 100%;
    height: auto;
    display: block;
    overflow: visible; /* verhindert, dass der Punkt beim Hochgehen beschnitten wird */
  }

  /* der Punkt: sanftes, elegantes Auf und Ab, größer als das Original */
  #dot-wrap {
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(1);
  }
  #dot {
    transform-box: fill-box;
    transform-origin: center;
    animation: dotBounce 1.8s cubic-bezier(.45,0,.2,1) infinite;
  }
  @keyframes dotBounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-100px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #dot { animation: none; }
  }
</style>
