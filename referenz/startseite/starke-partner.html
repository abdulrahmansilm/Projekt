<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selim-IT — Partner &amp; Lösungen (v5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F3F0;
    --ink:#05231F;
    --grad-start:#4FB8A6;
    --grad-end:#1B6E7A;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); font-family:'Outfit',sans-serif; color:var(--ink); }

  .section{ padding:100px 24px 0; overflow:hidden; }

  .intro{ max-width:640px; margin:0 auto; text-align:center; }
  .intro h2{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(28px,4vw,40px);
    line-height:1.2;
    letter-spacing:-0.01em;
  }
  .intro h2 .accent{ color:var(--grad-end); }
  .intro p{ margin-top:16px; font-size:17px; line-height:1.6; opacity:0.75; }

  /* ---------- Bühne ---------- */
  .stage{
    position:relative;
    width:1000px;
    height:500px;
    margin:56px auto 0;
    overflow:hidden;          /* schneidet die untere Kreishälfte weg */
  }

  /* konzentrische Halbkreise — Mittelpunkt auf der Grundlinie,
     Radien 120 / 235 / 350 / 465 → überall 115px Abstand */
  .arc{
    position:absolute;
    left:50%;
    border-radius:50%;
    border:1px solid rgba(27,110,122,0.30);
    background:rgba(79,184,166,0.055);
    transform:translateX(-50%);
    pointer-events:none;
  }
  .a4{ width:930px; height:930px; bottom:-465px; }
  .a3{ width:700px; height:700px; bottom:-350px; }
  .a2{ width:470px; height:470px; bottom:-235px; }
  .a1{ width:240px; height:240px; bottom:-120px; }

  .baseline{
    position:absolute;
    left:0; right:0; bottom:0;
    height:1px;
    background:rgba(27,110,122,0.30);
  }

  .orbit{ position:absolute; left:50%; bottom:0; width:0; height:0; }

  .node{
    position:absolute;
    left:var(--x); top:var(--y);
    width:var(--s); height:var(--s);
    margin-left:calc(var(--s) / -2);
    margin-top:calc(var(--s) / -2);
  }
  .node .chip{
    width:100%; height:100%;
    background:#FFFFFF;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(11,46,60,0.10);
    display:flex; align-items:center; justify-content:center;
    animation:float var(--d) ease-in-out infinite alternate;
    animation-delay:var(--dl);
  }
  .node .chip::before{
    content:"";
    width:44%; height:44%;
    border-radius:6px;
    background:linear-gradient(135deg, rgba(79,184,166,0.55), rgba(27,110,122,0.55));
  }
  @keyframes float{
    from{ transform:translateY(0); }
    to  { transform:translateY(-9px); }
  }

  /* Logo sitzt mittig im innersten Halbkreis (r = 120) */
  .hub{
    position:absolute;
    left:50%; bottom:24px;
    transform:translateX(-50%);
    width:34px;
    z-index:3;
  }
  .hub svg{ width:100%; height:auto; display:block; }

  @media (prefers-reduced-motion: reduce){
    .node .chip{ animation:none; }
  }

  @media (max-width:1060px){
    .stage{ transform:scale(0.78); transform-origin:top center; margin-bottom:-110px; }
  }
  @media (max-width:820px){
    .stage{ transform:scale(0.58); margin-bottom:-210px; }
  }
  @media (max-width:560px){
    .section{ padding:72px 16px 0; }
    .stage{ transform:scale(0.4); margin-top:32px; margin-bottom:-300px; }
  }
</style>
</head>
<body>

<section class="section">
  <div class="intro">
    <h2>Starke Partner für starke Lösungen</h2>
    <p>Wir arbeiten mit etablierten Herstellern und Plattformen, um für jede Anforderung die passende Lösung zusammenzustellen — Sie haben dabei nur einen Ansprechpartner.</p>
  </div>

  <div class="stage">
    <div class="arc a4"></div>
    <div class="arc a3"></div>
    <div class="arc a2"></div>
    <div class="arc a1"></div>
    <div class="baseline"></div>

    <div class="orbit">
      <!-- Bogen 2 (r = 235) -->
      <div class="node" style="--x:-199px; --y:-125px; --s:58px; --d:7.2s; --dl:-1.1s;"><div class="chip"></div></div>
      <div class="node" style="--x:80px;   --y:-221px; --s:58px; --d:8.1s; --dl:-3.4s;"><div class="chip"></div></div>
      <div class="node" style="--x:211px;  --y:-103px; --s:58px; --d:6.9s; --dl:-4.7s;"><div class="chip"></div></div>

      <!-- Bogen 3 (r = 350) -->
      <div class="node" style="--x:-338px; --y:-91px;  --s:60px; --d:7.8s; --dl:-2.2s;"><div class="chip"></div></div>
      <div class="node" style="--x:-185px; --y:-297px; --s:60px; --d:8.6s; --dl:-0.6s;"><div class="chip"></div></div>
      <div class="node" style="--x:164px;  --y:-309px; --s:60px; --d:7.4s; --dl:-3.9s;"><div class="chip"></div></div>
      <div class="node" style="--x:329px;  --y:-120px; --s:60px; --d:9.1s; --dl:-1.7s;"><div class="chip"></div></div>

      <!-- Bogen 4 (r = 465) -->
      <div class="node" style="--x:-356px; --y:-299px; --s:54px; --d:8.8s; --dl:-5.2s;"><div class="chip"></div></div>
      <div class="node" style="--x:49px;   --y:-462px; --s:54px; --d:7.6s; --dl:-2.8s;"><div class="chip"></div></div>
      <div class="node" style="--x:381px;  --y:-267px; --s:54px; --d:8.3s; --dl:-0.3s;"><div class="chip"></div></div>
    </div>

    <div class="hub">
      <svg viewBox="0 0 246.64 560.12" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hubGrad" x1="0" y1="0" x2="246.64" y2="560.12" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#4FB8A6"/>
            <stop offset="1" stop-color="#1B6E7A"/>
          </linearGradient>
        </defs>
        <path fill="url(#hubGrad)" d="M235.39,442.55c0,64.95-52.67,117.58-117.58,117.58S0,507.49,0,442.55V4.4h72.02v438.15c0,25.25,20.43,45.72,45.68,45.72s45.68-20.47,45.68-45.72V133.32h70.73Z"/>
        <path fill="url(#hubGrad)" d="M233.18,12.83c-8.98-8.55-20.34-12.83-34.12-12.83-12.94,0-24.1,4.28-33.49,12.83-9.39,8.56-14.08,19.93-14.08,34.12s4.69,25.57,14.08,34.12c9.39,8.56,20.55,12.83,33.49,12.83,13.77,0,25.14-4.27,34.12-12.83,8.97-8.55,13.46-19.92,13.46-34.12s-4.49-25.56-13.46-34.12Z"/>
      </svg>
    </div>
  </div>
</section>

</body>
</html>
