services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/app/uploads
    expose:
      - "8000"

volumes:
  backend_data:
  backend_uploads:
